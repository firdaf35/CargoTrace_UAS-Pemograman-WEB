services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DB_HOST: db
    depends_on: [db]
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: cargotrace
      MYSQL_ROOT_PASSWORD: secret
    ports: ["3307:3306"]
    volumes: [dbdata:/var/lib/mysql]
volumes:
  dbdata:
